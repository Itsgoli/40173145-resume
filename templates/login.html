<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود ادمین</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-container">
    <h2>🔐 ورود ادمین</h2>
    <form method="post" action="/login" autocomplete="off">
     
      <input type="text" name="fake_user" style="display:none" autocomplete="username">
      <input type="password" name="fake_pass" style="display:none" autocomplete="current-password">
      <input type="text" name="user_login" placeholder="نام کاربری" required autocomplete="off">
      <input type="password" name="user_pass" placeholder="رمز عبور" required autocomplete="new-password">
      <button type="submit" class="btn-login">ورود</button>
    </form>
    {% if error %}
      <p class="login-error">{{ error }}</p>
    {% endif %}
  </div>
</body>
</html>
